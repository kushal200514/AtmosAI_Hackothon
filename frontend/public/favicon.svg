<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="atmosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle Shield -->
  <circle cx="50" cy="50" r="46" fill="#070d1e" stroke="url(#atmosGrad)" stroke-width="3" />
  
  <!-- Atmosphere Dynamic Wave & AI Node -->
  <path d="M 24 58 C 34 38, 48 38, 55 50 C 62 62, 70 58, 76 44" stroke="url(#atmosGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <path d="M 22 46 C 32 30, 48 30, 56 42 C 64 54, 72 48, 78 36" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none" />
  
  <!-- Sensor / Intelligence Node Pulse -->
  <circle cx="55" cy="50" r="5" fill="#10b981" filter="url(#glow)" />
  <circle cx="55" cy="50" r="9" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
  <circle cx="38" cy="42" r="3" fill="#00f2fe" />
  <circle cx="68" cy="52" r="3.5" fill="#4facfe" />
</svg>
